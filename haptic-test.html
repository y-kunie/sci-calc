<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>振動テスト</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:16px; background:#1f1f23; color:#eceef2;
         font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif; line-height:1.6; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.lead { font-size:14px; color:#b9bcc6; margin:0 0 16px; }
  .row { display:flex; align-items:center; gap:14px; padding:14px 0; border-top:1px solid #3a3a40; }
  .no { font-size:26px; font-weight:800; width:34px; text-align:center; color:#e9c33f; flex:none; }
  .desc { flex:1; font-size:14px; }
  .desc b { display:block; font-size:15px; }
  .cnt { font-size:12px; color:#8fd2e8; }
  .ctl { flex:none; width:96px; display:flex; justify-content:center; }
  .key { position:relative; width:88px; height:52px; border:none; border-radius:8px; font-size:22px; font-weight:600; color:#fff;
         background:linear-gradient(180deg,#c4c4c9 0%,#a3a3aa 50%,#8f8f97 100%);
         box-shadow:0 3px 0 #35353b, 0 4px 4px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.5);
         display:flex; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none; }
  .key.down { transform:translateY(2px); filter:brightness(1.25); }
  /* キーの上に重ねる透明スイッチ: 指が直接スイッチに触れるようにする */
  .key input.cover { position:absolute; inset:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .op0  { opacity:0; }
  .op01 { opacity:0.01; }
  #ver { font-size:12px; color:#8a8d98; margin-top:18px; word-break:break-all; }
</style>
</head>
<body>
<h1>振動テスト</h1>
<p class="lead">iPhone で 1〜6 を順に数回ずつ押して、指先に「コツッ」と振動を感じた番号を教えてください。消音モードでも試せます。</p>

<div class="row"><div class="no">1</div>
  <div class="desc"><b>見えるスイッチ</b>指で切り替える <span class="cnt" id="c1"></span></div>
  <div class="ctl"><input type="checkbox" switch id="s1"></div></div>

<div class="row"><div class="no">2</div>
  <div class="desc"><b>キー + 透明スイッチ</b>完全に透明 <span class="cnt" id="c2"></span></div>
  <div class="ctl"><div class="key" id="k2">7<input type="checkbox" switch class="cover op0" id="s2"></div></div></div>

<div class="row"><div class="no">3</div>
  <div class="desc"><b>キー + 透明スイッチ</b>ごくわずかに不透明 <span class="cnt" id="c3"></span></div>
  <div class="ctl"><div class="key" id="k3">8<input type="checkbox" switch class="cover op01" id="s3"></div></div></div>

<div class="row"><div class="no">4</div>
  <div class="desc"><b>キー: 指を離したとき</b>プログラムから切り替え <span class="cnt" id="c4"></span></div>
  <div class="ctl"><button class="key" id="k4">9</button></div></div>

<div class="row"><div class="no">5</div>
  <div class="desc"><b>キー: 押した瞬間</b>プログラムから切り替え (いまの電卓と同じ) <span class="cnt" id="c5"></span></div>
  <div class="ctl"><button class="key" id="k5">4</button></div></div>

<div class="row"><div class="no">6</div>
  <div class="desc"><b>キー: クリック時</b>プログラムから切り替え <span class="cnt" id="c6"></span></div>
  <div class="ctl"><button class="key" id="k6">5</button></div></div>

<div id="ver"></div>

<script>
(function () {
  var n = {};
  function hit(i) { n[i] = (n[i] || 0) + 1; document.getElementById('c' + i).textContent = '(' + n[i] + ' 回)'; }
  function hapticByLabel() {
    try {
      var lb = document.createElement('label'), sw = document.createElement('input');
      lb.setAttribute('aria-hidden', 'true'); lb.style.display = 'none';
      sw.type = 'checkbox'; sw.setAttribute('switch', '');
      lb.appendChild(sw); document.head.appendChild(lb);
      lb.click();
      document.head.removeChild(lb);
    } catch (e) {}
  }
  function pressLook(el) {
    el.addEventListener('pointerdown', function () { el.classList.add('down'); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (t) {
      el.addEventListener(t, function () { el.classList.remove('down'); });
    });
  }
  document.getElementById('s1').addEventListener('change', function () { hit(1); });
  document.getElementById('s2').addEventListener('change', function () { hit(2); });
  document.getElementById('s3').addEventListener('change', function () { hit(3); });
  pressLook(document.getElementById('k2')); pressLook(document.getElementById('k3'));
  var k4 = document.getElementById('k4'), k5 = document.getElementById('k5'), k6 = document.getElementById('k6');
  [k4, k5, k6].forEach(pressLook);
  k4.addEventListener('touchend', function () { hapticByLabel(); hit(4); });
  k5.addEventListener('pointerdown', function () { hapticByLabel(); hit(5); });
  k6.addEventListener('click', function () { hapticByLabel(); hit(6); });
  document.getElementById('ver').textContent = navigator.userAgent +
    ' / standalone=' + (navigator.standalone === true) + ' / vibrate=' + (typeof navigator.vibrate);
})();
</script>
</body>
</html>
